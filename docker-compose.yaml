services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: ${NAME}_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myapp}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${PG_CPU_LIMIT:-2}'
          memory: ${PG_MEMORY_LIMIT:-6G}
        reservations:
          cpus: '${PG_CPU_RESERVED:-1}'
          memory: ${PG_MEMORY_RESERVED:-4G}
    networks:
      - app_network
    volumes:
      - ${POSTGRES_INIT_SCRIPTS_DIR:-./init-scripts}:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: ${NAME}_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE:-\"False\"}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${PGADMIN_CPU_LIMIT:-0.5}'
          memory: ${PGADMIN_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${PGADMIN_CPU_RESERVED:-0.25}'
          memory: ${PGADMIN_MEMORY_RESERVED:-512M}
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
